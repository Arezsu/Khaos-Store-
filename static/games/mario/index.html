<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER MARIO - Khaos Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
        }
        canvas {
            border: 2px solid red;
            background: #87CEEB;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 black;
        }
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 0 black;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 24px;
            display: none;
            background: black;
            padding: 20px;
            border: 2px solid red;
            text-align: center;
            z-index: 10;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: red;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="info">Monedas: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    <div class="controls">← → mover | ↑ saltar | ESC salir</div>
    <div id="gameOver" class="game-over">
        GAME OVER<br>
        Monedas: <span id="finalScore">0</span><br>
        <button onclick="location.reload()">JUGAR DE NUEVO</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let mario = {x: 50, y: 250, width: 30, height: 30, vx: 0, vy: 0, onGround: true};
        let coins = [];
        let score = 0;
        let gameRunning = true;
        
        for(let i = 0; i < 5; i++) {
            coins.push({x: 150 + i * 80, y: 230, width: 20, height: 20, collected: false});
        }
        
        let ground = {x: 0, y: 280, width: canvas.width, height: 20};
        
        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(ground.x, ground.y, ground.width, ground.height);
            
            ctx.fillStyle = 'red';
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
            
            ctx.fillStyle = 'gold';
            for(let coin of coins) {
                if(!coin.collected) {
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        function update() {
            if(!gameRunning) return;
            
            mario.x += mario.vx;
            mario.y += mario.vy;
            mario.vy += 0.5;
            
            if(mario.y + mario.height >= ground.y) {
                mario.y = ground.y - mario.height;
                mario.vy = 0;
                mario.onGround = true;
            } else {
                mario.onGround = false;
            }
            
            if(mario.x < 0) mario.x = 0;
            if(mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;
            
            for(let coin of coins) {
                if(!coin.collected && 
                   mario.x < coin.x + coin.width &&
                   mario.x + mario.width > coin.x &&
                   mario.y < coin.y + coin.height &&
                   mario.y + mario.height > coin.y) {
                    coin.collected = true;
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }
            
            if(mario.y + mario.height > canvas.height) {
                gameRunning = false;
                document.getElementById('finalScore').innerText = score;
                document.getElementById('gameOver').style.display = 'block';
            }
            
            draw();
        }
        
        document.addEventListener('keydown', function(e) {
            if(e.key === 'ArrowLeft') mario.vx = -5;
            if(e.key === 'ArrowRight') mario.vx = 5;
            if(e.key === 'ArrowUp' && mario.onGround) {
                mario.vy = -8;
                mario.onGround = false;
            }
            if(e.key === 'Escape') window.close();
        });
        
        document.addEventListener('keyup', function(e) {
            if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') mario.vx = 0;
        });
        
        setInterval(update, 20);
        draw();
        
        function saveScoreToParent() {
            if(window.parent && window.parent.saveScore) {
                window.parent.saveScore(3, score);
            }
        }
        
        setInterval(saveScoreToParent, 1000);
    </script>
</body>
</html>
