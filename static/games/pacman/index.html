<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PACMAN - Khaos Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Título del juego */
        h1 {
            color: #e94560;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 20px;
            font-size: 24px;
            font-family: monospace;
        }

        /* El contenedor del iframe tendrá un fondo y bordes redondeados */
        .iframe-wrapper {
            background: #000;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            display: inline-block;
        }

        /* Tu iframe original se mantiene, pero ahora es responsive */
        .game-frame {
            width: 342px;
            height: 490px;
            border: none;
            border-radius: 15px;
            display: block;
            margin: 0 auto;
        }

        /* Instrucciones */
        .controls {
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 30px;
            display: inline-block;
        }

        /* Para pantallas muy pequeñas (móviles) */
        @media (max-width: 480px) {
            .game-frame {
                width: 95%;
                height: auto;
                aspect-ratio: 342 / 490; /* Mantiene la proporción original */
            }
            .iframe-wrapper {
                width: 95%;
                padding: 5px;
            }
            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🟡 PACMAN - COME LOS PUNTOS 🟡</h1>
        <div class="iframe-wrapper">
            <!-- Tu código original, que funciona perfectamente -->
            <iframe 
                class="game-frame"
                src="https://funhtml5games.com?embed=pacman" 
                frameborder="0" 
                scrolling="no">
            </iframe>
        </div>
        <div class="controls">
            🎮 Usa las flechas del teclado para mover a Pacman. ¡Evita a los fantasmas!
        </div>
    </div>
</body>
</html>
