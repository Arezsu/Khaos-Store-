<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOOM - Khaos Games</title>
    <style>
        /* Reinicio de estilos para que el juego ocupe toda la pantalla del iframe */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita scroll en la página del juego */
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* El iframe ocupará todo el espacio posible manteniendo su proporción */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Barra de información opcional */
        .info-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #e94560;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none; /* Para que no interfiera con el clic en el juego */
        }

        /* Un pequeño mensaje para guiar al usuario */
        .instruction {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            color: #ccc;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- El iframe con la fuente oficial y confiable de js-dos.com -->
        <iframe 
            class="game-frame"
            src="https://js-dos.com/games/doom.exe.html" 
            frameborder="0" 
            scrolling="yes" 
            allowfullscreen>
        </iframe>
        <div class="info-bar">🔥 DOOM - Clásico FPS 🔥</div>
        <div class="instruction">💡 Consejo: Haz clic dentro del juego para activarlo. Usa el ratón para mirar y las teclas para moverte.</div>
    </div>
</body>
</html>
